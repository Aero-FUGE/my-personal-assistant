name: Deploy private DeepSeek backend
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deepseek-backend
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run backend:check
      - run: npm test
      - name: Deploy Worker and upload encrypted Secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          node --input-type=module -e 'for(const key of ["CLOUDFLARE_API_TOKEN","CLOUDFLARE_ACCOUNT_ID","DEEPSEEK_API_KEY","APP_PASSWORD","SESSION_SECRET"]){if(!process.env[key]){console.error("Missing secret: "+key);process.exit(1);}} if(process.env.APP_PASSWORD.length<16||process.env.SESSION_SECRET.length<32){console.error("APP_PASSWORD needs 16+ characters; SESSION_SECRET needs 32+ characters.");process.exit(1);}'
          npm run backend:deploy
          node --input-type=module -e 'process.stdout.write(JSON.stringify({DEEPSEEK_API_KEY:process.env.DEEPSEEK_API_KEY,APP_PASSWORD:process.env.APP_PASSWORD,SESSION_SECRET:process.env.SESSION_SECRET}));' | npx wrangler secret bulk --config backend/wrangler.jsonc
