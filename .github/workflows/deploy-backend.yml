name: Deploy private DeepSeek backend
on:
  workflow_call:
    inputs:
      operation:
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      APP_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      operation:
        description: "操作：release 第二阶段完整上线；diagnose 只读诊断；deploy 部署；migrate 迁移；migrate-and-deploy 两者"
        required: true
        type: choice
        default: deploy
        options:
          - release
          - diagnose
          - deploy
          - migrate
          - migrate-and-deploy
permissions:
  contents: read
concurrency:
  group: deepseek-backend
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: ${{ inputs.operation != 'diagnose' }}
      - run: npm run backend:check
        if: ${{ inputs.operation != 'diagnose' }}
      - run: npm test
        if: ${{ inputs.operation != 'diagnose' }}
      - name: Read-only Cloudflare Token and D1 diagnosis
        if: ${{ inputs.operation == 'diagnose' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/diagnose-cloudflare-token.mjs
      - name: Build frontend and verify release helpers
        if: ${{ inputs.operation == 'release' }}
        env:
          VITE_BASE_PATH: /
        run: |
          node --test scripts/diagnose-cloudflare-token.test.mjs scripts/release-stage2.test.mjs
          npm run build
      - name: Verify D1, migrate, deploy backend, configure VAPID and deploy frontend
        if: ${{ inputs.operation == 'release' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: node scripts/release-stage2.mjs
      - name: Check existing Cloudflare credentials
        if: ${{ inputs.operation != 'diagnose' && inputs.operation != 'release' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module -e 'for(const key of ["CLOUDFLARE_API_TOKEN","CLOUDFLARE_ACCOUNT_ID"]){if(!process.env[key]){console.error("Missing secret: "+key);process.exit(1);}}'
      - name: Apply remote D1 migrations (PUSH_DB)
        if: ${{ inputs.operation == 'migrate' || inputs.operation == 'migrate-and-deploy' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! npx wrangler d1 migrations apply PUSH_DB --remote --config backend/wrangler.jsonc; then
            echo '::error::D1 migration failed. For authentication/authorization errors (including 7403), check that the existing token has Account > D1 > Edit for the account containing PUSH_DB. Keep existing Workers permissions. No Secrets were changed by this workflow.'
            exit 1
          fi
          printf '%s\n' 'D1 remote migration completed successfully for PUSH_DB (my-personal-assistant-db). Already-applied migrations are skipped. No database was created or cleared.' >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy Worker (preserve existing Secrets)
        if: ${{ inputs.operation == 'deploy' || inputs.operation == 'migrate-and-deploy' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run backend:deploy
